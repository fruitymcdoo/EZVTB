[workspace]
resolver = "2"
members = [
    "crates/ezvtb-rig",
    "crates/ezvtb-tracking",
    "crates/ezvtb-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fruitymcdoo/EZVTB"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
